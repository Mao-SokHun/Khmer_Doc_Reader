name: Deploy to Production Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.SERVER_DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="/var/www/khmer-lesson-doc"
            fi

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "ERROR: Project not cloned yet at $DEPLOY_PATH"
              echo "Run on server first:"
              echo "  sudo mkdir -p $DEPLOY_PATH && sudo chown $USER:$USER $DEPLOY_PATH"
              echo "  git clone https://github.com/SokHun-Mao/Khmer_Doc_Reader.git $DEPLOY_PATH"
              exit 1
            fi

            cd "$DEPLOY_PATH"
            git fetch origin main
            git reset --hard origin/main

            if [ ! -f .env ]; then
              echo "ERROR: Missing .env on server. Copy from .env.example and configure secrets."
              exit 1
            fi

            docker compose --profile prod pull db 2>/dev/null || true
            docker compose --profile prod up -d --build --remove-orphans
            docker image prune -f

            echo "Deploy finished. App: port 3000, API: port 3001"
