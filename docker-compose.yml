# Khmer Lesson Doc — full stack (API + Vite frontend; DB: Neon or local PostgreSQL)
#
# Setup:
#   cp .env.example .env
#   # Neon (recommended): paste DATABASE_URL from Neon Console into .env
#   # Local DB instead: leave DATABASE_URL empty and set PGHOST/PGPASSWORD
#
# Start everything (dev, hot reload on port 3000) with Neon:
#   docker compose --profile dev up --build api web
#
# Start with local PostgreSQL container:
#   docker compose --profile dev --profile local-db up --build
#
# API + Neon only (no frontend):
#   docker compose up api
#
# Production (app + API + optional local DB + Watchtower):
#   docker compose --profile prod up -d --build api web-prod
#
# URLs (from your machine):
#   App:  http://localhost:3000
#   API:  http://localhost:3001

name: khmer-lesson-doc

services:
  db:
    profiles: [local-db]
    image: postgres:16-alpine
    container_name: khmer-lesson-doc-db
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_DB: ${PGDATABASE:-khmer_lesson_doc}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-khmer_lesson_doc}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: khmer-lesson-doc-api
    restart: unless-stopped
    labels:
      # Local images from `docker compose build` — deploy via GitHub Actions, not Watchtower
      - "com.centurylinklabs.watchtower.enable=false"
    command: node server.js
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      PGHOST: ${PGHOST:-db}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-khmer_lesson_doc}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      API_PORT: 3001
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
        required: false

  # Development frontend (Vite dev server)
  web:
    profiles: [dev]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: khmer-lesson-doc-web
    restart: unless-stopped
    command: npm run dev:client -- --host 0.0.0.0 --port 3000
    env_file:
      - .env
    environment:
      # Browser calls API on the host-published port
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

  # Production-style frontend (build + vite preview)
  web-prod:
    profiles: [prod]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: khmer-lesson-doc-web-prod
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    command: sh -c "npm run build && npm run preview -- --host 0.0.0.0 --port 3000"
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Auto-update containers that have label watchtower.enable=true (see DEPLOY.md)
  watchtower:
    profiles: [prod]
    image: containrrr/watchtower:1.7.1
    container_name: khmer-lesson-doc-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-86400}
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_ROLLING_RESTART: "true"
      TZ: ${TZ:-Asia/Phnom_Penh}

volumes:
  postgres_data:
  web_node_modules:
